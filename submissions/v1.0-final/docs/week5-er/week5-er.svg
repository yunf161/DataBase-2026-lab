<text x="98" y="1320" class="subtitle">标记：PK 主码　AK 候选码　FK 外码　UQ 可空唯一。联系标签“a / b”按规则表左→右读：每条左端对应 a 条右端，反向为 b。</text>
<text x="98" y="1347" class="subtitle">* 商品→库存业务期望 1..1，现有 PK+FK 实际只保证 0..1；草稿订单明细 0..N，确认或结算时由过程要求 1..N。</text>
