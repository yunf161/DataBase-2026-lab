<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183047}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#486174}.entity-title{font-size:20px;font-weight:700}.field{font-size:17px}.edge-label{font-size:16px;font-weight:600}</style>
<rect width="1600" height="900" fill="#f8fbfd"/>
